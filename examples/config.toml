# Skyline — neobrutalism (matched to niri / wofi pastel purple-blue)

[bar]
height = 42
# Room for hard island borders / drop-shadow feel
margin = [6, 10, 0, 10]
exclusive_zone = 32
anchor = "top"
# output = "DP-1"
padding = 4
island_gap = 12
separators = true
separator = "│"
tray_menu_gap = 4

[theme]
# Colors from wofi/niri: deep purple panels, lilac borders, soft blue accent
# RGBA floats in 0..=1
background = [0.039, 0.031, 0.078, 0.0]
# #322c4a
island_background = [0.196, 0.173, 0.290, 1.0]
# #ede8fa
text = [0.929, 0.910, 0.980, 1.0]
# #b4accf
muted = [0.706, 0.675, 0.812, 1.0]
# #a894e0 — niri active border / wofi window border
accent = [0.659, 0.580, 0.878, 1.0]
# #e08eb8 — niri urgent
danger = [0.878, 0.557, 0.722, 1.0]
# #8a7bc4
separator = [0.541, 0.482, 0.769, 0.55]
# Sharp corners (niri geometry-corner-radius 0 / wofi border-radius 0)
island_radius = 0.0
# Hard thick outline
island_border = [0.659, 0.580, 0.878, 1.0]
island_border_width = 3.0
# Hard cast shadow (wofi: 14px 14px 0 #0a0814 — scaled for the bar)
island_shadow = [0.039, 0.031, 0.078, 1.0]
island_shadow_offset = [6.0, 6.0]
island_shadow_blur = 0.0
island_padding = [4, 12]
island_margin = [0, 2]
font_size = 14.0
# Matches wofi
font = "Fira Sans"
emoji_font = "Noto Color Emoji"
meter_height = 16.0
meter_width = 4.0
meter_gap = 2.0
meter_bars = 12

[compositor]
backend = "auto"

[modules]
left = ["workspaces", "taskbar", "window"]
center = ["clock"]
right = ["tray", "cpu", "memory", "gpu", "network", "brightness", "volume"]
tray = true

[modules.clock]
format = "%a %b %d  ·  %I:%M %p"
tooltip_format = "%Y-%m-%d %I:%M:%S %p"

[modules.sys]
refresh_ms = 1000

[modules.workspaces]

[modules.taskbar]
width = 22.0
padding = 3.0
gap = 4.0
max_items = 12

[modules.window]
max_chars = 120

[modules.cpu]
label = "CPU"
format = "{label} {bar}"
on_click = "alacritty -e btop"

[modules.memory]
label = "RAM"
format = "{label} {bar}"

[modules.gpu]
label = "GPU"
format = "{label} {bar}"
on_click = "alacritty -e amdgpu_top"

[modules.network]
show_name = true
max_chars = 24
show_strength = false

[modules.volume]
step = 0.02
max_percent = 150.0
detect_bluetooth = true
show_device = false
show_percent = true
on_right_click = "pwvucontrol"
on_click = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

[modules.brightness]
step = 2.0
show_percent = true
